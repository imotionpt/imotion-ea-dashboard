<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Helvetica,sans-serif;background:#F8FAFC;color:#0F172A;min-height:100vh}
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:#003E82;display:flex;flex-direction:column;min-height:100vh;position:fixed;top:0;left:0;bottom:0;overflow-y:auto}
.main{margin-left:230px;flex:1;padding:28px 32px;min-height:100vh}
.logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,0.1)}
.logo-name{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:17px;color:#fff;margin-top:6px}
.logo-sub{font-size:9px;color:rgba(255,255,255,0.35);letter-spacing:0.15em;text-transform:uppercase}
.user-pill{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:#FF7100;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.user-name{font-size:12px;font-weight:600;color:#fff}
.user-role{font-size:10px;color:rgba(255,255,255,0.4)}
.nav{flex:1;padding:8px 0}
.nav-btn{width:100%;text-align:left;background:transparent;border:none;border-left:3px solid transparent;color:rgba(255,255,255,0.5);padding:11px 16px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:9px;transition:all 0.15s}
.nav-btn:hover{color:rgba(255,255,255,0.8);background:rgba(255,255,255,0.05)}
.nav-btn.active{background:rgba(255,113,0,0.18);border-left-color:#FF7100;color:#fff;font-weight:600}
.nav-badge{margin-left:auto;background:#FF7100;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.quick-links{padding:12px 14px;border-top:1px solid rgba(255,255,255,0.1)}
.ql-title{font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:7px}
.ql-link{font-size:11px;color:rgba(255,255,255,0.45);text-decoration:none;display:block;padding:4px 6px;border-radius:5px}
.ql-link:hover{color:#fff;background:rgba(255,255,255,0.08)}
.ql-empty{font-size:11px;color:rgba(255,255,255,0.2);padding:4px 6px;display:block}
.sb-bottom{padding:10px 14px 18px;border-top:1px solid rgba(255,255,255,0.1);display:flex;flex-direction:column;gap:7px}
.btn-orange{background:#FF7100;color:#fff;border:none;border-radius:8px;padding:10px 0;font-size:13px;font-weight:700;cursor:pointer;width:100%}
.btn-export{background:rgba(255,255,255,0.08);border:none;color:rgba(255,255,255,0.6);border-radius:8px;padding:8px 0;font-size:12px;cursor:pointer;width:100%}
.btn-signout{background:transparent;border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.35);border-radius:8px;padding:7px 0;font-size:11px;cursor:pointer;width:100%}
.page-title{font-size:22px;font-weight:700;color:#003E82;margin-bottom:4px}
.page-sub{font-size:13px;color:#475569;margin-bottom:22px}
.stat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:15px 14px}
.stat-label{font-size:9px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:7px}
.stat-val{font-size:28px;font-weight:800}
.alert{border-radius:9px;padding:11px 16px;margin-bottom:9px;font-size:13px;font-weight:500}
.alert-red{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA}
.alert-amber{background:#FFFBEB;color:#92400E;border:1px solid #FDE68A}
.alert-blue{background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE}
.sec-head{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin:18px 0 9px;display:flex;align-items:center;gap:7px}
.sec-bar{width:3px;height:13px;border-radius:0;flex-shrink:0}
.task-card{background:#fff;border:1px solid #E2E8F0;border-radius:9px;margin-bottom:7px;overflow:hidden;border-left-width:4px;border-left-style:solid}
.task-row{padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.task-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;color:#0F172A}
.task-name.done{text-decoration:line-through;color:#94A3B8}
.task-meta{font-size:11px;color:#94A3B8;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px}
.task-actions{display:flex;gap:4px;flex-shrink:0}
.task-btn{width:27px;height:27px;border-radius:6px;border:1px solid #E2E8F0;background:#F8FAFC;cursor:pointer;font-size:12px;color:#475569}
.task-btn:hover{background:#E2E8F0}
.delegate-panel{padding:10px 14px;background:#EFF6FF;border-top:1px solid #BFDBFE;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.delegate-panel-title{font-size:10px;font-weight:700;color:#1D4ED8;text-transform:uppercase;letter-spacing:0.08em;margin-right:4px}
.chip{font-size:11px;font-weight:600;padding:4px 12px;border-radius:14px;border:1px solid #003E82;color:#003E82;background:#fff;cursor:pointer}
.chip:hover{background:#003E82;color:#fff}
.chip.active-chip{background:#003E82;color:#fff}
.chip.remove-chip{border-color:#DC2626;color:#DC2626;background:#fff}
.chip.remove-chip:hover{background:#DC2626;color:#fff}
.chip.empty-msg{border:none;color:#94A3B8;cursor:default;background:none}
.expand-detail{padding:12px 14px;border-top:1px solid #F1F5F9;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.expand-label{font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:3px}
.expand-val{font-size:12px;color:#475569;line-height:1.6}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:20px 22px;margin-bottom:16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid #E2E8F0;border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;background:#fff;color:#0F172A;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#003E82}
.field textarea{resize:vertical;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1/-1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal{background:#fff;border-radius:14px;padding:26px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:17px;font-weight:800;color:#003E82}
.close-btn{background:none;border:none;font-size:20px;cursor:pointer;color:#94A3B8}
.save-btn{flex:1;background:#FF7100;color:#fff;border:none;border-radius:8px;padding:12px 0;font-size:13px;font-weight:700;cursor:pointer}
.cancel-btn{background:#F1F5F9;color:#475569;border:1px solid #E2E8F0;border-radius:8px;padding:12px 16px;font-size:13px;cursor:pointer}
.tab-bar{display:flex;border-bottom:1px solid #E2E8F0;margin-bottom:16px}
.tab{background:none;border:none;padding:10px 20px;font-size:13px;cursor:pointer;color:#94A3B8;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
.tab.active{color:#FF7100;border-bottom-color:#FF7100;font-weight:600}
.admin-highlight{border:2px solid #FF7100;border-radius:12px;padding:20px 22px;background:#fff;margin-bottom:18px}
.delegate-tag{display:inline-flex;align-items:center;gap:6px;background:#003E82;border-radius:14px;padding:5px 7px 5px 12px;margin:3px}
.delegate-tag span{font-size:12px;color:#fff;font-weight:600}
.delegate-tag button{background:rgba(255,255,255,0.25);border:none;color:#fff;width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:10px;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.delegate-tag button:hover{background:rgba(255,255,255,0.5)}
.team-toggle{font-size:11px;font-weight:600;padding:5px 13px;border-radius:14px;cursor:pointer;border:1px solid #E2E8F0;background:#F8FAFC;color:#475569;margin:3px}
.team-toggle.on{background:#FF7100;color:#fff;border-color:#FF7100}
.add-row{display:flex;gap:8px;margin-bottom:14px}
.add-row input{flex:1;border:1px solid #E2E8F0;border-radius:8px;padding:8px 11px;font-size:13px;font-family:inherit;outline:none}
.add-row input:focus{border-color:#003E82}
.add-btn{background:#003E82;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer}
.search-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search-row input,.search-row select{border:1px solid #E2E8F0;border-radius:8px;padding:8px 11px;font-size:12px;font-family:inherit;background:#fff;color:#0F172A;outline:none}
.search-row input:focus,.search-row select:focus{border-color:#003E82}

// ── GRAPH API HELPER ──
async function getToken() {
  const accounts = msalInstance.getAllAccounts();
  if (!accounts.length) throw new Error("No accounts found");
  try {
    const result = await msalInstance.acquireTokenSilent({ scopes: SCOPES, account: accounts[0] });
    return result.accessToken;
  } catch(e) {
    const result = await msalInstance.acquireTokenPopup({ scopes: SCOPES });
    return result.accessToken;
  }
}

async function graphCall(endpoint, method = "GET", body = null) {
  const token = await getToken();
  const options = {
    method,
    headers: {
      "Authorization": `Bearer ${token}`,
      "Content-Type": "application/json",
    }
  };
  if (body) options.body = JSON.stringify(body);
  const response = await fetch(`${GRAPH_BASE}${endpoint}`, options);
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || `Graph API error: ${response.status}`);
  }
  if (response.status === 204) return null;
  return response.json();
}

// ── SHAREPOINT LIST OPERATIONS ──
async function spGetItems(listName, select, filter) {
  select = select || "";
  filter = filter || "";
  // Expand ALL fields without select restriction — avoids missing custom columns
  let url = `/sites/${SITE_ID}/lists/${listName}/items?expand=fields`;
  if (filter) url += `&$filter=${filter}`;
  const data = await graphCall(url);
  return data.value.map(i => ({ spId: i.id, ...i.fields }));
}

async function spCreateItem(listName, fields) {
  const data = await graphCall(`/sites/${SITE_ID}/lists/${listName}/items`, "POST", { fields });
  return { spId: data.id, ...data.fields };
}

async function spUpdateItem(listName, spId, fields) {
  await graphCall(`/sites/${SITE_ID}/lists/${listName}/items/${spId}/fields`, "PATCH", fields);
}

async function spDeleteItem(listName, spId) {
  await graphCall(`/sites/${SITE_ID}/lists/${listName}/items/${spId}`, "DELETE");
}

// ── FILE ATTACHMENT UPLOAD (to dedicated SharePoint document library) ──
function formatFileSize(bytes){
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1)+' KB';
  return (bytes/1024/1024).toFixed(2)+' MB';
}

async function uploadAttachmentFile(file, onProgress) {
  const token = await getToken();
  // Sanitize filename - remove characters SharePoint doesn't allow in file names
  const safeName = file.name.replace(/[#%&*:<>?/\\{|}"]/g, "_");
  // Prefix with timestamp to avoid name collisions between different uploads
  const uniqueName = `${Date.now()}_${safeName}`;

  // Small files (<=4MB): one-shot upload, fast path
  if (file.size <= 4 * 1024 * 1024) {
    if(onProgress) onProgress(0);
    const arrayBuffer = await file.arrayBuffer();
    const response = await fetch(
      `${GRAPH_BASE}/sites/${SITE_ID}/lists/${LISTS.attachments}/drive/root:/${encodeURIComponent(uniqueName)}:/content`,
      {
        method: "PUT",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": file.type || "application/octet-stream",
        },
        body: arrayBuffer,
      }
    );
    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `Upload failed: ${response.status}`);
    }
    if(onProgress) onProgress(100);
    const data = await response.json();
    return { name: file.name, url: data.webUrl, size: formatFileSize(file.size) };
  }

  // Larger files (up to 100MB): chunked upload session
  const sessionResponse = await fetch(
    `${GRAPH_BASE}/sites/${SITE_ID}/lists/${LISTS.attachments}/drive/root:/${encodeURIComponent(uniqueName)}:/createUploadSession`,
    {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${token}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ item: { "@microsoft.graph.conflictBehavior": "rename" } }),
    }
  );
  if (!sessionResponse.ok) {
    const err = await sessionResponse.json().catch(() => ({}));
    throw new Error(err.error?.message || `Could not start upload: ${sessionResponse.status}`);
  }
  const session = await sessionResponse.json();
  const uploadUrl = session.uploadUrl;

  const CHUNK_SIZE = 5 * 1024 * 1024; // 5MB chunks - a clean multiple of the 320KiB Graph requires
  const totalSize = file.size;
  let offset = 0;
  let finalData = null;

  while (offset < totalSize) {
    const end = Math.min(offset + CHUNK_SIZE, totalSize);
    const chunk = file.slice(offset, end);
    const chunkBuffer = await chunk.arrayBuffer();

    // Note: no Authorization header here - the uploadUrl itself is pre-authenticated
    const chunkResponse = await fetch(uploadUrl, {
      method: "PUT",
      headers: {
        "Content-Length": String(end - offset),
        "Content-Range": `bytes ${offset}-${end-1}/${totalSize}`,
      },
      body: chunkBuffer,
    });

    if (!chunkResponse.ok) {
      const err = await chunkResponse.json().catch(() => ({}));
      throw new Error(err.error?.message || `Upload failed at byte ${offset}: ${chunkResponse.status}`);
    }

    offset = end;
    if(onProgress) onProgress(Math.round((offset/totalSize)*100));

    if (chunkResponse.status === 200 || chunkResponse.status === 201) {
      finalData = await chunkResponse.json();
    }
  }

  if (!finalData) throw new Error("Upload did not complete properly.");
  return { name: file.name, url: finalData.webUrl, size: formatFileSize(file.size) };
}

// ── DATA CONVERSION: SharePoint fields <-> App format ──
function spToTask(sp) {
  let attachments = [];
  try {
    attachments = sp.AttachmentData ? JSON.parse(sp.AttachmentData) : [];
  } catch(e) {
    attachments = [];
  }
  return {
    id: sp.spId,
    spId: sp.spId,
    name: sp.Title || sp.Task_x0020_Name || sp.LinkTitle || "",
    category: sp.Catagory || sp.Category || "",
    owner: sp.Owner || "",
    delegatedTo: sp.DelegatedTo || "",
    status: sp.Status || "Not Started",
    priority: sp.Priority || "Medium",
    dueDate: sp.DueDate ? sp.DueDate.split("T")[0] : "",
    lastUpdate: sp.Modified ? sp.Modified.split("T")[0] : today(),
    nextAction: sp.NextAction || "",
    waitingOn: sp.WaitingOn || "",
    notes: sp.Notes || "",
    attachments: attachments,
    plannerLink: sp.PlannerLink || "",
  };
}

function taskToSp(task) {
  const fields = { Title: task.name };
  if(task.status) fields.Status = task.status;
  if(task.priority) fields.Priority = task.priority;
  if(task.nextAction && task.nextAction.trim()) fields.NextAction = task.nextAction;
  if(task.waitingOn && task.waitingOn.trim()) fields.WaitingOn = task.waitingOn;
  if(task.notes && task.notes.trim()) fields.Notes = task.notes;
  if(task.delegatedTo && task.delegatedTo.trim()) fields.DelegatedTo = task.delegatedTo;
  if(task.plannerLink && task.plannerLink.trim()) fields.PlannerLink = task.plannerLink;
  if(task.category && task.category.trim()) fields.Catagory = task.category;
  if(task.dueDate && task.dueDate.trim()) {
    try {
      const d = new Date(task.dueDate + "T12:00:00");
      if(!isNaN(d.getTime())) fields.DueDate = d.toISOString();
    } catch(e) { console.warn("Invalid date:", task.dueDate); }
  }
  // Always include attachments (even if empty array) so removing attachments correctly clears the field
  fields.AttachmentData = JSON.stringify(task.attachments || []);
  return fields;
}

function set(patch){Object.assign(S,patch);render();}
function today(){return new Date().toISOString().split('T')[0];}
function fmtDate(d){if(!d)return'—';try{return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return d;}}
function isOverdue(t){return t.status!=='Done'&&t.dueDate&&new Date(t.dueDate+'T23:59:59')<new Date();}
function daysSince(d){if(!d)return 0;return Math.floor((Date.now()-new Date(d+'T12:00:00'))/86400000);}
function canEdit(){return S.user&&['admin','manager'].includes(S.user.role);}
function isAdmin(){return S.user&&S.user.role==='admin';}
// Full visibility + full control: Pratik (admin) and Arnel specifically, regardless of role
function canSeeAllTasks(){return S.user&&(S.user.role==='admin'||S.user.name==='Arnel');}
// Anyone who isn't a pure viewer can create their own tasks
function canCreateTasks(){return S.user&&S.user.role!=='viewer';}
// Per-task check: full-access users can act on anything; everyone else only on tasks they own or are delegated
function canEditTask(t){
  if(!S.user) return false;
  if(canSeeAllTasks()) return true;
  if(S.user.role==='viewer') return false;
  return t.owner===S.user.name || t.delegatedTo===S.user.name;
}
// The task list scoped to what the current user is allowed to see
function visibleTasks(){
  if(canSeeAllTasks()) return S.tasks;
  if(!S.user) return [];
  return S.tasks.filter(t=>t.owner===S.user.name || t.delegatedTo===S.user.name);
}

function stats(){
  const vt = visibleTasks();
  return {
    open:vt.filter(t=>t.status!=='Done').length,
    overdue:vt.filter(t=>isOverdue(t)).length,
    waiting:vt.filter(t=>t.status==='Waiting').length,
    high:vt.filter(t=>t.priority==='High'&&t.status!=='Done').length,
    delegated:vt.filter(t=>t.delegatedTo&&t.status!=='Done').length,
    done:vt.filter(t=>t.status==='Done').length,
    stale:vt.filter(t=>t.status!=='Done'&&daysSince(t.lastUpdate)>=2).length,
  };
}

function filtered(){
  return visibleTasks().filter(t=>{
    if(S.fStatus!=='All'&&t.status!==S.fStatus)return false;
    if(S.fCat!=='All'&&t.category!==S.fCat)return false;
    if(S.fPri!=='All'&&t.priority!==S.fPri)return false;
    if(S.search&&!t.name.toLowerCase().includes(S.search.toLowerCase())&&!(t.notes||'').toLowerCase().includes(S.search.toLowerCase()))return false;
    return true;
  });
}

function emptyForm(){
  return {name:'',category:'Operations',owner:S.user?S.user.name:'Arnel',delegatedTo:'',status:'Not Started',priority:'Medium',dueDate:'',nextAction:'',waitingOn:'',notes:'',attachments:[],plannerLink:''};
}

// ── MICROSOFT LOGIN ──
async function initAuth() {
  if (!msalInstance) {
    set({loading:false, authMode:"pin"});
    return;
  }
  try {
    // Handle redirect response first
    await msalInstance.handleRedirectPromise();
    const accounts = msalInstance.getAllAccounts();
    if (accounts.length > 0) {
      await loginWithAccount(accounts[0]);
    } else {
      set({loading:false});
    }
  } catch(e) {
    console.error("Auth init error:", e);
    set({loading:false, loginError: "Authentication error. Please try again."});
  }
}

async function loginWithAccount(account) {
  set({loading:true, loadingMsg:"Loading your dashboard..."});
  try {
    // Get user profile
    msalInstance.setActiveAccount(account);
    const me = await graphCall("/me");

    // Match to known users by email
    const email = me.mail || me.userPrincipalName || "";
    let matchedUser = S.users.find(u => u.email.toLowerCase() === email.toLowerCase());

    if (!matchedUser) {
      // Auto-create user entry if they have Microsoft 365 access
      matchedUser = {
        name: me.displayName || email,
        email: email,
        role: "viewer",
        title: me.jobTitle || "",
        active: true,
      };
    }

    if (!matchedUser.active) {
      set({loading:false, loginError:"Your account has been deactivated. Contact Pratik."});
      return;
    }

    // Load tasks from SharePoint
    set({loadingMsg:"Loading tasks from SharePoint..."});
    let tasks = [];
    try {
      const spTasks = await spGetItems(LISTS.tasks, "id,Title,Status,Priority,Catagory,DueDate,NextAction,WaitingOn,Notes,DelegatedTo,PlannerLink,Owner,AttachmentData,Modified");
      tasks = spTasks.map(spToTask);
    } catch(e) {
      console.error("Tasks load error:", e);
      set({loading:false, loginError:"Could not load tasks. Your account may not have access to the iMotion SharePoint site yet. Please contact Pratik to request access."});
      return;
    }

    // Load config from SharePoint
    set({loadingMsg:"Loading configuration..."});
    try {
      const configItems = await spGetItems(LISTS.config);
      const config = {...S.config};
      configItems.forEach(item => {
        const key = item.Title || item.ConfigKey;
        const val = item.ConfigValue || "";
        if(key === "OutlookCalendarUrl" && val) config.outlookUrl = val;
        else if(key === "TeamsUrl" && val) config.teamsUrl = val;
        else if(key === "PlannerUrl" && val) config.plannerUrl = val;
        else if(key === "ExcelTrackerUrl" && val) config.excelWebUrl = val;
        else if(key === "TeamsNotificationChannel" && val) config.teamsChannel = val;
        else if(key === "DelegateList" && val) {
          S.delegates = val.split(",").map(d=>d.trim()).filter(Boolean);
        }
      });
      S.config = config;
    } catch(e) {
      console.warn("Could not load config:", e);
    }

    // Load today's brief from SharePoint
    try {
      set({loadingMsg:"Loading today's brief..."});
      const todayStr = today();
      const briefs = await spGetItems(LISTS.briefs, "id,Title,TopPriorities,PendingDecisions,Followups,StuckItems,Modified");
      const todayBrief = briefs.find(b => (b.Title || "").includes(todayStr));
      if(todayBrief) {
        S.brief = {
          priorities: todayBrief.TopPriorities || "",
          decisions: todayBrief.PendingDecisions || "",
          followups: todayBrief.Followups || "",
          stuck: todayBrief.StuckItems || "",
          submitted: true,
          time: todayBrief.Modified ? new Date(todayBrief.Modified).toLocaleTimeString() : "earlier today",
        };
      }
    } catch(e) {
      console.warn("Could not load brief:", e);
    }

    // Load this week's review
    try {
      const reviews = await spGetItems(LISTS.weekly, "id,Title,WeekOf,Wins,MissedTasks,Bottlenecks,Suggestions,Modified");
      const weekStart = new Date();
      weekStart.setDate(weekStart.getDate() - weekStart.getDay());
      const weekStr = weekStart.toISOString().split("T")[0];
      const thisWeekReview = reviews.find(r => {
        const reviewDate = (r.WeekOf || r.Title || "").split("T")[0];
        return reviewDate >= weekStr;
      });
      if(thisWeekReview) {
        S.weekly = {
          wins: thisWeekReview.Wins || "",
          missed: thisWeekReview.MissedTasks || "",
          bottlenecks: thisWeekReview.Bottlenecks || "",
          suggestions: thisWeekReview.Suggestions || "",
          submitted: true,
        };
      }
    } catch(e) {
      console.warn("Could not load weekly review:", e);
    }

    set({
      user: matchedUser,
      msAccount: account,
      tasks: tasks,
      loading: false,
      loginError: "",
    });

  } catch(e) {
    console.error("Login error:", e);
    set({loading:false, loginError:"Could not load data from SharePoint. " + e.message});
  }
}

async function doMicrosoftLogin() {
  try {
    set({loading:true, loadingMsg:"Redirecting to Microsoft login..."});
    await msalInstance.loginRedirect({ scopes: SCOPES });
  } catch(e) {
    console.error("Login failed:", e);
    set({loading:false, loginError:"Login failed. Please try again."});
  }
}

async function doSignOut() {
  if (msalInstance && S.msAccount) {
    await msalInstance.logoutPopup({ account: S.msAccount });
  }
  set({user:null, msAccount:null, tasks:[], loading:false});
}

// ── TASK CRUD WITH SHAREPOINT ──
async function saveTask() {
  const form = S.form;
  const name = (document.getElementById('mf-name')||{}).value || form.name || '';
  if(!name.trim()){alert('Please enter a task name.');return;}

  const updated = {
    ...form,
    name: (document.getElementById('mf-name')||{}).value || form.name,
    category: (document.getElementById('mf-cat')||{}).value || form.category,
    priority: (document.getElementById('mf-pri')||{}).value || form.priority,
    status: (document.getElementById('mf-status')||{}).value || form.status,
    dueDate: (document.getElementById('mf-due')||{}).value || form.dueDate,
    owner: (document.getElementById('mf-owner')||{}).value || form.owner,
    delegatedTo: (document.getElementById('mf-delegate')||{}).value || "",
    nextAction: (document.getElementById('mf-next')||{}).value || form.nextAction,
    waitingOn: (document.getElementById('mf-waiting')||{}).value || form.waitingOn,
    notes: (document.getElementById('mf-notes')||{}).value || form.notes,
    plannerLink: (document.getElementById('mf-planner')||{}).value || form.plannerLink || '',
    attachments: S.form.attachments || [],
    lastUpdate: today(),
  };

  set({syncing:true});
  try {
    const spFields = taskToSp(updated);
    if(S.editId) {
      // Update existing
      const task = S.tasks.find(t=>t.id===S.editId);
      if(task && task.spId) {
        await spUpdateItem(LISTS.tasks, task.spId, spFields);
      }
      set({tasks:S.tasks.map(t=>t.id===S.editId?{...updated,id:S.editId,spId:t.spId}:t),showModal:false,syncing:false});
    } else {
      // Create new
      const created = await spCreateItem(LISTS.tasks, spFields);
      const newTask = {...updated, id:created.spId, spId:created.spId};
      set({tasks:[...S.tasks,newTask],showModal:false,syncing:false});
    }
  } catch(e) {
    console.error("Save error:", e);
    alert("Error saving task: " + e.message);
    set({syncing:false});
  }
}

async function markDone(id) {
  const task = S.tasks.find(t=>t.id===id);
  if(!task) return;
  set({syncing:true, tasks:S.tasks.map(t=>t.id===id?{...t,status:'Done',lastUpdate:today()}:t)});
  try {
    if(task.spId) await spUpdateItem(LISTS.tasks, task.spId, {Status:'Done'});
  } catch(e) { console.error("Mark done error:", e); }
  set({syncing:false});
}

async function delTask(id) {
  if(!confirm('Delete this task?')) return;
  const task = S.tasks.find(t=>t.id===id);
  set({tasks:S.tasks.filter(t=>t.id!==id), expandedId:S.expandedId===id?null:S.expandedId, syncing:true});
  try {
    if(task && task.spId) await spDeleteItem(LISTS.tasks, task.spId);
  } catch(e) { console.error("Delete error:", e); }
  set({syncing:false});
}

async function delegateTask(id, person) {
  const task = S.tasks.find(t=>t.id===id);
  set({syncing:true, tasks:S.tasks.map(t=>t.id===id?{...t,delegatedTo:person,lastUpdate:today()}:t), delegateFor:null});
  try {
    if(task && task.spId) await spUpdateItem(LISTS.tasks, task.spId, {DelegatedTo:person});
  } catch(e) { console.error("Delegate error:", e); }
  set({syncing:false});
}

async function submitBrief() {
  set({syncing:true});
  try {
    const now = new Date();
    await spCreateItem(LISTS.briefs, {
      Title: `Daily Brief ${today()}`,
      TopPriorities: S.brief.priorities,
      PendingDecisions: S.brief.decisions,
      Followups: S.brief.followups,
      StuckItems: S.brief.stuck,
    });
    set({brief:{...S.brief,submitted:true,time:now.toLocaleTimeString()},briefTab:'view',syncing:false});
  } catch(e) {
    console.error("Brief submit error:", e);
    set({brief:{...S.brief,submitted:true,time:new Date().toLocaleTimeString()},briefTab:'view',syncing:false});
  }
}

async function submitWeekly() {
  set({syncing:true});
  try {
    const now = new Date();
    await spCreateItem(LISTS.weekly, {
      Title: `Weekly Review ${today()}`,
      WeekOf: now.toISOString(),
      Wins: S.weekly.wins,
      MissedTasks: S.weekly.missed,
      Bottlenecks: S.weekly.bottlenecks,
      Suggestions: S.weekly.suggestions,
      SubmittedAt: now.toISOString(),
    });
    set({weekly:{...S.weekly,submitted:true},syncing:false});
  } catch(e) {
    console.error("Weekly submit error:", e);
    set({weekly:{...S.weekly,submitted:true},syncing:false});
  }
}

async function refreshTasks() {
  set({syncing:true});
  try {
    const spTasks = await spGetItems(LISTS.tasks, "id,Title,Status,Priority,Catagory,DueDate,NextAction,WaitingOn,Notes,DelegatedTo,PlannerLink,Owner,AttachmentData,Modified");
    set({tasks:spTasks.map(spToTask),syncing:false});
  } catch(e) {
    console.error("Refresh error:", e);
    set({syncing:false});
  }
}

// ── RENDER ──
function render(){
  const root = document.getElementById('root');

  if(S.loading) {
    root.innerHTML = `<div class="loading-screen">
      <div class="loading-spinner"></div>
      <div style="color:#fff;font-size:14px;font-weight:500">${esc(S.loadingMsg)}</div>
      <div style="color:rgba(255,255,255,0.4);font-size:12px;margin-top:8px">iMotion Physical Therapy</div>
    </div>`;
    return;
  }

  if(!S.user) {
    root.innerHTML = `<div class="login-wrap" style="margin-left:0">${loginHTML()}</div>`;
    attachLoginEvents();
    return;
  }

  const st = stats();
  let content = '';
  if(S.view==='dashboard') content = dashHTML(st);
  else if(S.view==='tasks') content = allTasksHTML();
  else if(S.view==='open') content = openHTML();
  else if(S.view==='delegated') content = delegatedHTML(st);
  else if(S.view==='brief') content = briefHTML();
  else if(S.view==='admin'&&isAdmin()) content = adminHTML();

  root.innerHTML = `
    <div class="app">
      ${sidebarHTML(st)}
      <div class="main">${content}</div>
    </div>
    ${S.showModal ? modalHTML() : ''}
  `;
  attachEvents();
}

function taskCardHTML(t){
  const over=isOverdue(t);
  const stale=daysSince(t.lastUpdate)>=2&&t.status!=='Done';
  const exp=S.expandedId===t.id;
  const delOpen=S.delegateFor===t.id;
  const cc=CAT_C[t.category]||'#888';
  const sc=ST_C[t.status]||ST_C['Not Started'];
  const pc=PRI_C[t.priority]||'#ccc';
  return `<div class="task-card" style="border-left-color:${pc};${over?'border-color:#FECACA;':''}">
    <div class="task-row" data-expand="${t.id}">
      <div style="flex:1;min-width:0">
        <div class="task-name${t.status==='Done'?' done':''}">${esc(t.name)}</div>
        <div class="task-meta">
          <span>${esc(t.owner)}</span>
          ${t.delegatedTo?`<span style="color:#3088D8;font-weight:600">→ ${esc(t.delegatedTo)}</span>`:''}
          <span>· Due ${fmtDate(t.dueDate)}</span>
          ${over?`<span style="color:#DC2626;font-weight:700">OVERDUE</span>`:''}
          ${stale&&!over?`<span style="color:#D97706">No update ${daysSince(t.lastUpdate)}d</span>`:''}
          ${(t.attachments||[]).length>0?`<span style="color:#3088D8">📎 ${t.attachments.length}</span>`:''}
        </div>
      </div>
      <div style="display:flex;gap:5px;align-items:center;flex-shrink:0">
        <span class="badge" style="background:${cc}18;color:${cc}">${esc(t.category)}</span>
        <span class="badge" style="background:${sc.bg};color:${sc.text}">${esc(t.status)}</span>
      </div>
      ${canEditTask(t)?`<div class="task-actions" data-stop="1">
        ${t.status!=='Done'?`<button class="task-btn" style="color:#16A34A;border-color:#BBF7D0" data-done="${t.id}" title="Mark done">✓</button>`:''}
        <button class="task-btn" style="color:#1D4ED8;border-color:#BFDBFE" data-delopen="${t.id}" title="Delegate">↗</button>
        ${t.delegatedTo?`<button class="task-btn" style="color:#6264A7;border-color:#C4B5FD" data-notify="${t.id}" title="Notify in Teams">💬</button>`:''}
        <button class="task-btn" style="color:#475569" data-edit="${t.id}" title="Edit">✎</button>
        <button class="task-btn" style="color:#DC2626;border-color:#FECACA" data-del="${t.id}" title="Delete">✕</button>
      </div>`:''}
    </div>
    ${delOpen?delegatePanelHTML(t):''}
    ${exp?expandHTML(t):''}
  </div>`;
}

function delegatePanelHTML(t){
  const chips=S.delegates.length===0
    ?`<span class="chip empty-msg">No delegates. Add in Admin Panel.</span>`
    :S.delegates.map(m=>`<button class="chip${t.delegatedTo===m?' active-chip':''}" data-delegate="${t.id}" data-person="${esc(m)}">${esc(m)}</button>`).join('');
  const remove=t.delegatedTo?`<button class="chip remove-chip" data-delegate="${t.id}" data-person="">Remove</button>`:'';
  return `<div class="delegate-panel" data-stop="1">
    <span class="delegate-panel-title">Delegate to:</span>
    ${chips}${remove}
  </div>`;
}

function expandHTML(t){
  const attsHTML = (t.attachments||[]).length
    ? `<div style="grid-column:1/-1"><div class="expand-label">Attachments</div><div class="expand-val">${
        t.attachments.map(a=>a.url
          ? `<a href="${esc(a.url)}" target="_blank" style="color:#003E82;text-decoration:none;display:inline-block;margin-right:10px">📎 ${esc(a.name)}</a>`
          : `<span style="display:inline-block;margin-right:10px">📎 ${esc(a.name)}</span>`
        ).join('')
      }</div></div>`
    : '';
  return `<div class="expand-detail">
    <div><div class="expand-label">Next Action</div><div class="expand-val">${esc(t.nextAction)||'—'}</div></div>
    <div><div class="expand-label">Waiting On</div><div class="expand-val">${esc(t.waitingOn)||'—'}</div></div>
    <div style="grid-column:1/-1"><div class="expand-label">Notes</div><div class="expand-val">${esc(t.notes)||'—'}</div></div>
    <div><div class="expand-label">Last Update</div><div class="expand-val">${fmtDate(t.lastUpdate)}</div></div>
    <div><div class="expand-label">Due Date</div><div class="expand-val">${fmtDate(t.dueDate)}</div></div>
    ${attsHTML}
  </div>`;
}

function taskListHTML(tasks){
  if(!tasks||!tasks.length)return`<div class="no-tasks">No tasks here. 🎉</div>`;
  return tasks.map(taskCardHTML).join('');
}

function secHead(label,color){
  return `<div class="sec-head"><div class="sec-bar" style="background:${color}"></div><span style="color:${color}">${label}</span></div>`;
}

function dashHTML(st){
  const vt = visibleTasks();
  const hi=vt.filter(t=>t.priority==='High'&&t.status!=='Done');
  const wa=vt.filter(t=>t.status==='Waiting');
  return `<div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <div class="page-title">Good morning, ${esc(S.user.name.split(' ')[0])} 👋</div>
      ${S.syncing?`<span style="font-size:11px;color:#FF7100;font-weight:600">● Saving...</span>`:`<span style="font-size:11px;color:#16A34A;font-weight:600">● Synced</span>`}
    </div>

function attachEvents(){
  document.querySelectorAll('[data-view]').forEach(el=>{
    el.addEventListener('click',()=>set({view:el.dataset.view,delegateFor:null,expandedId:null}));
  });
  const bAdd=document.getElementById('btn-add-task');
  if(bAdd)bAdd.addEventListener('click',()=>set({showModal:true,editId:null,form:emptyForm()}));
  const bAdd2=document.getElementById('btn-add-task2');
  if(bAdd2)bAdd2.addEventListener('click',()=>set({showModal:true,editId:null,form:emptyForm()}));
  const bOut=document.getElementById('btn-signout');
  if(bOut)bOut.addEventListener('click',doSignOut);
  const bExp=document.getElementById('btn-export');
  if(bExp)bExp.addEventListener('click',exportData);
  const bRef=document.getElementById('btn-refresh');
  if(bRef)bRef.addEventListener('click',refreshTasks);

  document.querySelectorAll('[data-expand]').forEach(el=>{
    el.addEventListener('click',()=>{const id=el.dataset.expand;set({expandedId:S.expandedId===id?null:id});});
  });
  document.querySelectorAll('[data-stop]').forEach(el=>{
    el.addEventListener('click',e=>e.stopPropagation());
  });
  document.querySelectorAll('[data-done]').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();markDone(el.dataset.done);});
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();delTask(el.dataset.del);});
  });
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();const t=S.tasks.find(t=>t.id===el.dataset.edit);if(t)set({showModal:true,editId:el.dataset.edit,form:{...t}});});
  });
  document.querySelectorAll('[data-delopen]').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();const id=el.dataset.delopen;set({delegateFor:S.delegateFor===id?null:id});});
  });
  document.querySelectorAll('[data-notify]').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();notifyInTeams(el.dataset.notify);});
  });
  document.querySelectorAll('[data-delegate]').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();delegateTask(el.dataset.delegate,el.dataset.person);});
  });
  document.querySelectorAll('[data-btab]').forEach(el=>{el.addEventListener('click',()=>set({briefTab:el.dataset.btab}));});
  document.querySelectorAll('[data-wtab]').forEach(el=>{el.addEventListener('click',()=>set({weeklyTab:el.dataset.wtab}));});
  document.querySelectorAll('[data-brief]').forEach(el=>{el.addEventListener('input',()=>{S.brief[el.dataset.brief]=el.value;});});
  document.querySelectorAll('[data-weekly]').forEach(el=>{el.addEventListener('input',()=>{S.weekly[el.dataset.weekly]=el.value;});});

  const bBrief=document.getElementById('btn-brief-submit');
  if(bBrief)bBrief.addEventListener('click',submitBrief);
  const bWeekly=document.getElementById('btn-weekly-submit');
  if(bWeekly)bWeekly.addEventListener('click',submitWeekly);
  const bEmailBrief=document.getElementById('btn-email-brief');
  if(bEmailBrief)bEmailBrief.addEventListener('click',emailDailyBrief);
  const bEmailWeekly=document.getElementById('btn-email-weekly');
  if(bEmailWeekly)bEmailWeekly.addEventListener('click',emailWeeklyReview);

  const fSearch=document.getElementById('f-search');
  if(fSearch)fSearch.addEventListener('input',e=>set({search:e.target.value}));
  const fStatus=document.getElementById('f-status');
  if(fStatus)fStatus.addEventListener('change',e=>set({fStatus:e.target.value}));
  const fCat=document.getElementById('f-cat');
  if(fCat)fCat.addEventListener('change',e=>set({fCat:e.target.value}));
  const fPri=document.getElementById('f-pri');
  if(fPri)fPri.addEventListener('change',e=>set({fPri:e.target.value}));

  document.querySelectorAll('[data-rem-delegate]').forEach(el=>{
    el.addEventListener('click',()=>{
      const n=el.dataset.remDelegate;
      const newDelegates = S.delegates.filter(d=>d!==n);
      set({delegates:newDelegates});
      saveDelegateListToSP(newDelegates);
    });
  });
  document.querySelectorAll('[data-toggle-delegate]').forEach(el=>{
    el.addEventListener('click',()=>{
      const n=el.dataset.toggleDelegate;
      const newDelegates = S.delegates.includes(n)?S.delegates.filter(d=>d!==n):[...S.delegates,n];
      set({delegates:newDelegates});
      saveDelegateListToSP(newDelegates);
    });
  });
  const bAddDel=document.getElementById('btn-add-delegate');
  if(bAddDel)bAddDel.addEventListener('click',addDelegate);
  const ndInput=document.getElementById('new-delegate-input');
  if(ndInput){
    ndInput.addEventListener('input',e=>S.newDelegate=e.target.value);
    ndInput.addEventListener('keydown',e=>{if(e.key==='Enter')addDelegate();});
  }
  document.querySelectorAll('[data-toggle-active]').forEach(el=>{
    el.addEventListener('click',()=>{const em=el.dataset.toggleActive;set({users:S.users.map(u=>u.email===em?{...u,active:!u.active}:u)});});
  });
  document.querySelectorAll('[data-role]').forEach(el=>{
    el.addEventListener('change',()=>{const em=el.dataset.role;set({users:S.users.map(u=>u.email===em?{...u,role:el.value}:u)});});
  });
  const bInvite=document.getElementById('btn-invite');
  if(bInvite)bInvite.addEventListener('click',sendInvite);
  document.querySelectorAll('[data-cfg]').forEach(el=>{
    el.addEventListener('input',()=>{S.config[el.dataset.cfg]=el.value;});
  });
  ['nu-name','nu-email','nu-title'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener('input',()=>{const key={'nu-name':'name','nu-email':'email','nu-title':'title'}[id];S.newUser[key]=el.value;});
  });
  const nuRole=document.getElementById('nu-role');
  if(nuRole)nuRole.addEventListener('change',()=>S.newUser.role=nuRole.value);

  const mbg=document.getElementById('modal-bg');
  if(mbg)mbg.addEventListener('click',e=>{if(e.target===mbg)set({showModal:false});});
  const bClose=document.getElementById('btn-modal-close');
  if(bClose)bClose.addEventListener('click',()=>set({showModal:false}));
  const bClose2=document.getElementById('btn-modal-close2');
  if(bClose2)bClose2.addEventListener('click',()=>set({showModal:false}));
  const bSave=document.getElementById('btn-save');
  if(bSave)bSave.addEventListener('click',saveTask);

  document.querySelectorAll('[data-rem-att]').forEach(el=>{
    el.addEventListener('click',()=>{const i=parseInt(el.dataset.remAtt);S.form.attachments=S.form.attachments.filter((_,j)=>j!==i);render();});
  });
  const fileDrop=document.getElementById('file-drop');
  const fileInput=document.getElementById('file-input');
  if(fileDrop&&fileInput){
    fileDrop.addEventListener('click',()=>{ if(!S.uploadingFiles) fileInput.click(); });
    fileInput.addEventListener('change', async e=>{
      const files=Array.from(e.target.files);
      if(!files.length) return;
      S.uploadingFiles = true; // set directly (no render) so we don't wipe other unsaved fields mid-upload
      const labelEl = document.getElementById('file-drop-label');
      if(labelEl) labelEl.textContent = 'Uploading...';
      for(const f of files){
        // 100MB cap - generous for scanned docs/photos while keeping browser uploads reliable
        if(f.size > 100*1024*1024){
          alert(`"${f.name}" is too large (over 100MB). Please use a smaller file, or share it via a SharePoint link instead.`);
          continue;
        }
        try{
          const uploaded = await uploadAttachmentFile(f, (pct)=>{
            if(labelEl) labelEl.textContent = `Uploading ${f.name}... ${pct}%`;
          });
          S.form.attachments = [...(S.form.attachments||[]), uploaded];
        } catch(err){
          console.error("Attachment upload error:", err);
          alert(`Could not upload "${f.name}": ${err.message}`);
        }
      }
      set({uploadingFiles:false}); // single re-render here, refreshes the attachment list display
      fileInput.value = '';
    });
  }
}

async function saveDelegateListToSP(delegates) {
  try {
    const configItems = await spGetItems(LISTS.config);
    const delegateItem = configItems.find(i => i.Title === "DelegateList");
    if(delegateItem && delegateItem.spId) {
      await spUpdateItem(LISTS.config, delegateItem.spId, {ConfigValue: delegates.join(",")});
    }
  } catch(e) {
    console.warn("Could not save delegate list:", e);
  }
}

function addDelegate(){
  const input=document.getElementById('new-delegate-input');
  const name=(input?input.value:S.newDelegate).trim();
  if(!name||S.delegates.includes(name))return;
  const newDelegates = [...S.delegates, name];
  set({delegates:newDelegates, newDelegate:''});
  saveDelegateListToSP(newDelegates);
}

function sendInvite(){
  const nu=S.newUser;
  const name=(document.getElementById('nu-name')||{}).value||nu.name;
  const email=(document.getElementById('nu-email')||{}).value||nu.email;
  const title=(document.getElementById('nu-title')||{}).value||nu.title;
  const role=(document.getElementById('nu-role')||{}).value||nu.role;
  if(!name||!email){alert('Please enter name and email.');return;}
  set({users:[...S.users,{name,email,role,title,active:true}],newUser:{name:'',email:'',role:'staff',title:''},inviteSent:true});
  setTimeout(()=>set({inviteSent:false}),3000);
}

function exportData(){
  if(S.config.excelWebUrl){window.open(S.config.excelWebUrl,'_blank');return;}
  const rows=[['Task','Category','Owner','Delegated To','Status','Priority','Due Date','Next Action','Waiting On','Notes']];
  S.tasks.forEach(t=>rows.push([t.name,t.category,t.owner,t.delegatedTo,t.status,t.priority,t.dueDate,t.nextAction,t.waitingOn,t.notes]));
  const csv=rows.map(r=>r.map(c=>`"${(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='iMotion_Tasks.csv';a.click();
}

function notifyInTeams(id) {
  const task = S.tasks.find(t => t.id === id);
  if(!task || !task.delegatedTo) return;

  // Find the person's email from the users list
  const person = S.users.find(u => u.name === task.delegatedTo);
  const email = person ? person.email : '';

  const msgText =
    `Hi ${task.delegatedTo}, you have been assigned a task on the iMotion EA Dashboard.\n\n` +
    `📋 Task: ${task.name}\n` +
    `📁 Category: ${task.category || '—'}\n` +
    `⚡ Priority: ${task.priority || '—'}\n` +
    `📅 Due: ${task.dueDate ? new Date(task.dueDate + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—'}\n` +
    `${task.nextAction ? '▶ Next Action: ' + task.nextAction + '\n' : ''}` +
    `\nPlease review and update status in the dashboard.`;

  // Copy message to clipboard and open Teams
  if(navigator.clipboard) {
    navigator.clipboard.writeText(msgText).then(() => {
      alert('Message copied to clipboard!\n\nTeams will open — just paste (Ctrl+V) in the chat with ' + task.delegatedTo + '.');
      if(email) {
        window.open('https://teams.microsoft.com/l/chat/0/0?users=' + encodeURIComponent(email), '_blank');
      } else {
        window.open('https://teams.microsoft.com', '_blank');
      }
    });
  } else {
    // Fallback - just open Teams
    if(email) {
      window.open('https://teams.microsoft.com/l/chat/0/0?users=' + encodeURIComponent(email), '_blank');
    } else {
      window.open('https://teams.microsoft.com', '_blank');
    }
  }
}

function esc(s){
  if(s===null||s===undefined)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
